name: bookmarkd
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^18.1.2
  supabase_flutter: ^2.18.3
  dio: ^5.11.1
  cached_network_image: ^4.0.6
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  equatable: ^3.0.0
  get_it: ^9.3.0
  shimmer: ^4.0.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_lints: ^6.0.0
flutter:

  uses-material-design: true

  assets:
    - assets/logo.png

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader_14pt-Regular.ttf
        - asset: assets/fonts/Newsreader_14pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader_14pt-Italic.ttf
          style: italic
